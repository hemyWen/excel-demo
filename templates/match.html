<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息表匹配 - Excel 数据处理工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">员工工资录入</a>
                </li>
                <li class="nav-item">
                    <a href="/match" class="nav-link active">人员信息表匹配</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <form id="matchForm" enctype="multipart/form-data">
            <div class="main-content">
                <!-- 左侧：源数据表 -->
                <div class="left-section">
                    <div class="section-header">
                        <h2 class="section-title">源数据表</h2>
                    </div>
                    <table class="data-table" id="sourceTable">
                        <thead>
                            <tr>
                                <th style="width: 380px;"></th>
                                <th>姓名列名</th>
                                <th>身份证列名</th>
                                <th>其他列配置</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="file-upload-cell">
                                        <button type="button" class="file-btn" onclick="selectFile(1)">选择文件</button>
                                        <input type="file" id="file1" name="file_1" class="file-input" accept=".xlsx,.xls" onchange="fileSelected(1)">
                                        <span class="file-name" id="fileName1"></span>
                                    </div>
                                </td>
                                <td><input type="text" id="nameCol1" name="name_col_1" class="column-input" placeholder="请输入"></td>
                                <td><input type="text" id="idCol1" name="id_col_1" class="column-input" placeholder="请输入"></td>
                                <td><input type="text" id="otherCol1" name="other_col_1" class="column-input" placeholder="请输入"></td>
                            </tr>
                        </tbody>
                    </table>
                    <button type="button" class="add-row-btn" onclick="addSourceRow()">新增</button>
                </div>

                <!-- 右侧：目标表 -->
                <div class="right-section">
                    <div class="section-header">
                        <h2 class="section-title">目标表</h2>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 380px;"></th>
                                <th>姓名列</th>
                                <th>身份证列名</th>
                                <th>其他列配置</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="file-upload-cell">
                                        <button type="button" class="file-btn" onclick="selectFile('b')">选择文件</button>
                                        <input type="file" id="fileB" name="file_b" class="file-input" accept=".xlsx,.xls" required onchange="fileSelected('b')">
                                        <span class="file-name" id="fileNameB"></span>
                                    </div>
                                </td>
                                <td><input type="text" id="nameColB" name="name_col_b" class="column-input" placeholder="请输入"></td>
                                <td><input type="text" id="idColB" name="id_col_b" class="column-input" placeholder="请输入" required></td>
                                <td><input type="text" id="otherColB" name="other_col_b" class="column-input" placeholder="请输入"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 提交按钮 -->
            <div class="submit-section">
                <button type="submit" class="submit-btn" id="submitBtn">提交处理</button>
            </div>
        </form>

        <!-- 结果区域 -->
        <div id="resultArea" class="result-area" hidden>
            <div class="success-message">
                <span class="success-icon">&#10004;</span>
                <span>处理完成！</span>
            </div>
            <a id="downloadLink" href="#" class="download-btn">下载处理结果</a>
        </div>

        <!-- 错误区域 -->
        <div id="errorArea" class="error-area" hidden>
            <div class="error-message">
                <span class="error-icon">&#10008;</span>
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
